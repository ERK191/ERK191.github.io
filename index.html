<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoChat | Secure Messaging</title>
    <!-- Reads the library file locally from your repository -->
    <script src="supabase.js"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #111827; 
            padding: 30px; 
            border-radius: 12px; 
            width: 420px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); 
            border: 1px solid #1f2937;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            margin: 0;
        }
        .logo-sub {
            font-size: 12px;
            color: #9ca3af;
            margin: 4px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input { 
            width: 94%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #374151; 
            background: #1f2937; 
            color: #fff; 
            border-radius: 6px; 
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #00ff88;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #00ff88; 
            border: none; 
            color: #0b0f19; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 8px; 
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover {
            background: #00e677;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }
        .hidden { display: none !important; }
        #chat-box { 
            height: 320px; 
            border: 1px solid #374151; 
            background: #0b0f19; 
            overflow-y: auto; 
            padding: 12px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
        }
        .msg { 
            margin-bottom: 12px; 
            padding: 8px 12px; 
            border-radius: 6px; 
            background: #1f2937; 
            border-left: 3px solid #00ff88;
        }
        .msg-meta { 
            font-size: 11px; 
            color: #00ff88; 
            margin-bottom: 4px; 
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <h1 class="logo-text">CryptoChat</h1>
        <p class="logo-sub">End-to-End Database Layer</p>
    </div>

    <!-- AUTH INTERFACE -->
    <div id="auth-section">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleAuth('login')">Secure Log In</button>
        <button onclick="handleAuth('signup')" style="background:#374151; color:#fff; margin-top:12px;">Create Encrypted Account</button>
    </div>

    <!-- CHAT INTERFACE -->
    <div id="chat-section" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            <span style="font-size: 14px; color: #9ca3af;">Status: <span style="color:#00ff88;">● Connected</span></span>
            <button onclick="logout()" style="width:auto; padding:6px 12px; background:#ef4444; color:#fff; margin:0; font-size:12px;">Disconnect</button>
        </div>
        <div id="chat-box"></div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="message-input" placeholder="Type an encrypted message..." style="margin:0; flex-grow: 1;">
            <button onclick="sendMessage()" style="width:80px; margin:0;">Send</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://jrbxdmgpvnkjlwwihvdl.supabase.co";";
    // ⚠️ PASTE YOUR PUBLIC KEY BETWEEN THE QUOTES BELOW
    const SUPABASE_KEY = "sb_publishable_GRYhrmnBUqbUs_4rNbgSew_M8lM-zQV";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;

    window.onload = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) setupChat(session.user);
    };

    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if(!email || !password) return alert("Please fill in all fields.");

        const { data, error } = type === 'login' 
            ? await supabase.auth.signInWithPassword({ email, password })
            : await supabase.auth.signUp({ email, password });

        if (error) return alert(error.message);
        if (type === 'signup') alert("Account created! Check your email to confirm registration.");
        if (data.user && type === 'login') setupChat(data.user);
    }

    function setupChat(user) {
        currentUser = user;
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('chat-section').classList.remove('hidden');
        loadMessages();
        
        supabase.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                displayMessage(payload.new);
            }).subscribe();
    }

    async function loadMessages() {
        const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
        if (error) console.error(error);
        document.getElementById('chat-box').innerHTML = '';
        if (data) data.forEach(displayMessage);
    }

    function displayMessage(msg) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<div class="msg-meta">${msg.user_email}</div><div>${escapeHtml(msg.text)}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        if (!input.value.trim()) return;

        const { error } = await supabase.from('messages').insert([
            { user_id: currentUser.id, user_email: currentUser.email, text: input.value }
        ]);

        if (error) alert("Security Block: " + error.message);
        input.value = '';
    }

    async function logout() {
        await supabase.auth.signOut();
        location.reload();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
