<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoChat | Direct Access Edition</title>
    <!-- 📦 Reads the engine file locally from your repository -->
    <script src="supabase.js"></script>
    <style>
        :root {
            --bg-leftmost: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --blurple: #5865f2;
            --green: #23a55a;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-leftmost); color: var(--text-normal);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* 🔐 INSTANT DISCORD STYLE LOGIN */
        .login-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: var(--bg-sidebar); padding: 35px; border-radius: 8px; width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .login-box h2 { margin: 0 0 6px 0; text-align: center; color: white;}
        .login-box p { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px;}
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; color: var(--text-normal); }
        input { width: 94%; padding: 10px; background: var(--bg-leftmost); border: 1px solid #111; color: #fff; border-radius: 4px; outline: none; }
        input:focus { border-color: var(--blurple); }
        button { width: 100%; padding: 12px; background: var(--blurple); color: #fff; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #4752c4; }

        /* 🕹️ WORKSPACE LAYOUT */
        .app-container { display: flex; width: 100vw; height: 100vh; }
        .server-bar { width: 72px; background: var(--bg-leftmost); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 10px; }
        .server-btn { width: 48px; height: 48px; background: var(--bg-sidebar); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .server-btn:hover, .server-btn.active { border-radius: 16px; background: var(--blurple); color: white; }
        .sub-sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-header { height: 48px; border-bottom: 1px solid rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 16px; font-weight: bold; color: white; }
        .list-container { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; overflow-y: auto; }
        .list-item { padding: 8px 12px; border-radius: 4px; color: var(--text-muted); cursor: pointer; font-size: 14px; }
        .list-item:hover, .list-item.active { background: rgba(255,255,255,0.06); color: #fff; }
        .user-panel { height: 52px; background: #232428; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
        
        /* 💬 CHAT FRAME */
        .main-chat { flex-grow: 1; background: var(--bg-chat); display: flex; flex-direction: column; }
        .chat-header { height: 48px; border-bottom: 1px solid rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 20px; font-weight: bold; color: white; justify-content: space-between; }
        .messages-pane { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg-card { display: flex; gap: 14px; }
        .avatar { width: 38px; height: 38px; background: #4e5058; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-meta { font-size: 13px; font-weight: bold; color: white; }
        .msg-meta span { font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 6px; }
        .msg-value { font-size: 14px; color: var(--text-normal); margin-top: 3px; }
        .compose-bar { padding: 20px; }
        .compose-wrap { background: #383a40; border-radius: 8px; padding: 10px; }
        .compose-wrap input { width: 98%; border: none; background: transparent; padding: 4px; color: white; margin:0; }
        
        .hidden { display: none !important; }
        .action-input { margin-bottom: 10px; display: flex; gap: 6px; }
        .action-input input { flex-grow: 1; margin: 0; }
        .action-input button { width: auto; padding: 0 12px; font-size: 12px; margin: 0; }
    </style>
</head>
<body>

    <!-- 🔐 SCREEN 1: DISCORD LOGIN SHOWS INSTANTLY -->
    <div id="auth-section" class="login-wrap">
        <div class="login-box">
            <h2>Welcome to CryptoChat</h2>
            <p>Enter details to open your secure workspace</p>
            
            <div class="input-group">
                <label>Unique Username</label>
                <input type="text" id="username" placeholder="e.g. cyberGhost (Signup Only)">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@domain.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button onclick="handleAuth('login')">Log In</button>
            <button onclick="handleAuth('signup')" style="background:#4e5058; margin-top:10px;">Register New Profile</button>
        </div>
    </div>

    <!-- 🕹️ SCREEN 2: MAIN WORKSPACE INTERFACE -->
    <div id="chat-section" class="app-container hidden">
        <div class="server-bar">
            <div class="server-btn active" id="btn-dm-view" onclick="switchMainTab('dms')">DMs</div>
            <div style="width:32px; height:2px; background:#3f4147; margin:4px 0;"></div>
            <div id="servers-list-icons" style="display:flex; flex-direction:column; gap:8px;"></div>
            <div class="server-btn" style="background:#23a55a; color:white;" onclick="createNewServer()">+</div>
        </div>

        <div class="sub-sidebar">
            <div>
                <div class="sidebar-header" id="sidebar-title">Direct Messages</div>
                <div class="list-container">
                    <div id="action-drawer-area"></div>
                    <div id="sidebar-items-list"></div>
                </div>
            </div>
            
            <div class="user-panel">
                <div style="display:flex; flex-direction:column;">
                    <span id="my-profile-name" style="font-weight:bold; color:white; font-size:14px;">User</span>
                    <span id="my-profile-email" style="font-size:11px; color:var(--text-muted);">Email</span>
                </div>
                <button onclick="location.reload()" style="width:auto; padding:4px 8px; background:#da373c; font-size:11px; margin:0;">Log Out</button>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <span id="active-chat-title"># Select a channel or add a DM friend</span>
            </div>
            
            <div class="messages-pane" id="chat-box"></div>
            
            <div class="compose-bar">
                <div class="compose-wrap">
                    <input type="text" id="message-input" placeholder="Send a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                </div>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://jrbxdmgpvnkjlwwihvdl.supabase.co";
    // ⚠️ PASTE YOUR LONG sb_publishable KEY INSIDE THE QUOTES BELOW
    const SUPABASE_KEY = "sb_publishable_GRYhrmnBUqbUs_4rNbgSew_M8lM-zQV";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let userId = null, userEmail = null, currentUsername = "User";
    let activeTab = "dms"; 
    let activeTargetId = null;

    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const userIn = document.getElementById('username').value.trim();

        if (!email || !password) return alert("Fields cannot be empty.");
        if (type === 'signup' && !userIn) return alert("Provide a custom Username.");

        try {
            if (type === 'signup') {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                
                const targetUid = data.user?.id || data.id;
                await supabase.from('profiles').insert([{ id: targetUid, username: userIn, email: email }]);
                alert("Account created! Check your real email inbox for a link.");
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                userId = data.user.id;
                userEmail = data.user.email;

                const { data: prof } = await supabase.from('profiles').select('*').eq('id', userId);
                currentUsername = (prof && prof.length > 0) ? prof[0].username : email.split('@')[0];

                document.getElementById('my-profile-name').innerText = currentUsername;
                document.getElementById('my-profile-email').innerText = userEmail;

                document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('chat-section').classList.remove('hidden');
            
            switchMainTab('dms');
            setInterval(loadMessages, 2500); 
        }
    } catch(e) { alert("Access Denied: " + e.message); }
}

async function switchMainTab(tab) {
    activeTab = tab;
    activeTargetId = null;
    document.getElementById('chat-box').innerHTML = '';
    document.getElementById('active-chat-title').innerText = "# Select a channel window";
    
    const dmBtn = document.getElementById('btn-dm-view');
    if (tab === 'dms') dmBtn.classList.add('active'); else dmBtn.classList.remove('active');

    loadSidebarStructure();
}

async function loadSidebarStructure() {
    const actionArea = document.getElementById('action-drawer-area');
    const listArea = document.getElementById('sidebar-items-list');
    actionArea.innerHTML = ''; listArea.innerHTML = '';

    if (activeTab === 'dms') {
        document.getElementById('sidebar-title').innerText = "Direct Messages";
        actionArea.innerHTML = `
            <div class="action-input">
                <input type="text" id="search-dm-username" placeholder="Enter friend's username...">
                <button onclick="startDirectMessage()">Add</button>
            </div>
        `;
        const { data: rooms } = await supabase.from('dm_rooms').select('*').or(`user_one.eq.${userId},user_two.eq.${userId}`);
        if (rooms) {
            rooms.forEach(r => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerText = `💬 DM Session Room #${r.id}`;
                item.onclick = () => { activeTargetId = r.id; document.getElementById('active-chat-title').innerText = `Direct Chat Room #${r.id}`; loadMessages(); };
                listArea.appendChild(item);
            });
        }
    } else {
        const { data: servers } = await supabase.from('servers').select('*');
        const iconsBox = document.getElementById('servers-list-icons');
        iconsBox.innerHTML = '';
        if (servers) {
            servers.forEach(s => {
                const icon = document.createElement('div');
                icon.className = `server-icon ${activeTargetId === s.id ? 'active' : ''}`;
                icon.innerText = s.name.substring(0,2).toUpperCase();
                icon.onclick = () => loadServerChannels(s.id, s.name);
                iconsBox.appendChild(icon);
            });
        }
    }
}

async function createNewServer() {
    const name = prompt("Enter Server Guild Name:");
    if(!name) return;
    const { data: s } = await supabase.from('servers').insert([{ name, owner_id: userId }]).select();
    if(s && s.length > 0) await supabase.from('channels').insert([{ server_id: s[0].id, name: 'general' }]);
    switchMainTab('servers');
}

async function loadServerChannels(serverId, serverName) {
    document.getElementById('sidebar-title').innerText = serverName;
    const actionArea = document.getElementById('action-drawer-area');
    const listArea = document.getElementById('sidebar-items-list');
    actionArea.innerHTML = `<button onclick="addChannelToServer(${serverId})" style="width:100%; padding:6px; background:var(--blurple); color:white; border:none; border-radius:4px; cursor:pointer;">+ Add Channel</button>`;
    listArea.innerHTML = '';

    const { data: channels } = await supabase.from('channels').select('*').eq('server_id', serverId);
    if (channels) {
        channels.forEach(c => {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerText = `# ${c.name}`;
            item.onclick = () => { activeTargetId = c.id; document.getElementById('active-chat-title').innerText = `Channel: #${c.name}`; loadMessages(); };
            listArea.appendChild(item);
        });
    }
}

async function addChannelToServer(serverId) {
    const name = prompt("Enter channel name:");
    if(!name) return;
    await supabase.from('channels').insert([{ server_id: serverId, name: name.toLowerCase() }]);
    loadServerChannels(serverId, document.getElementById('sidebar-title').innerText);
}

async function startDirectMessage() {
    const targetUser = document.getElementById('search-dm-username').value.trim();
    if(!targetUser) return;
    const { data: profile } = await supabase.from('profiles').select('*').eq('username', targetUser);
    if(!profile || profile.length === 0) return alert("User username profile tag not found.");
    await supabase.from('dm_rooms').insert([{ user_one: userId, user_two: profile[0].id }]);
    loadSidebarStructure();
}

async function loadMessages() {
    if (!activeTargetId) return;
    const column = activeTab === 'dms' ? 'dm_room_id' : 'channel_id';
    const { data } = await supabase.from('messages').select('*').eq(column, activeTargetId).order('created_at', { ascending: true });
    
    if (data) {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        data.forEach(msg => {
            const tStr = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const div = document.createElement('div');
            div.className = 'msg-card';
            div.innerHTML = `
                <div class="avatar">${msg.username.charAt(0).toUpperCase()}</div> 
                <div class="msg-content"> 
                    <div class="msg-meta">${msg.username} <span>Today at ${tStr}</span></div> 
                    <div class="msg-value">${escapeHtml(msg.text)}</div> 
                </div>
            `;
            chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

async function sendMessage() {
    const input = document.getElementById('message-input');
    if (!input.value.trim() || !activeTargetId) return;
    const payload = { user_id: userId, username: currentUsername, text: input.value };
    if(activeTab === 'dms') payload.dm_room_id = activeTargetId; else payload.channel_id = activeTargetId;
    await supabase.from('messages').insert([payload]);
    input.value = '';
    loadMessages();
}

function escapeHtml(t) { 
    return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
}
