<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoChat | Secure Messaging</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #111827; 
            padding: 30px; 
            border-radius: 12px; 
            width: 420px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); 
            border: 1px solid #1f2937;
        }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-text { font-size: 28px; font-weight: 800; color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.4); margin: 0; }
        .logo-sub { font-size: 12px; color: #9ca3af; margin: 4px 0 0 0; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 94%; padding: 12px; margin: 10px 0; border: 1px solid #374151; background: #1f2937; color: #fff; border-radius: 6px; outline: none; }
        input:focus { border-color: #00ff88; }
        button { width: 100%; padding: 12px; background: #00ff88; border: none; color: #0b0f19; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 8px; font-size: 14px; }
        .hidden { display: none !important; }
        #chat-box { height: 320px; border: 1px solid #374151; background: #0b0f19; overflow-y: auto; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; background: #1f2937; border-left: 3px solid #00ff88; }
        .msg-meta { font-size: 11px; color: #00ff88; margin-bottom: 4px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <h1 class="logo-text">CryptoChat</h1>
        <p class="logo-sub">Ultra-Fast Database Layer</p>
    </div>

    <!-- AUTH INTERFACE -->
    <div id="auth-section">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleAuth('login')">Secure Log In</button>
        <button onclick="handleAuth('signup')" style="background:#374151; color:#fff; margin-top:12px;">Create Encrypted Account</button>
    </div>

    <!-- CHAT INTERFACE -->
    <div id="chat-section" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            <span style="font-size: 14px; color: #9ca3af;">Status: <span style="color:#00ff88;">● Live Stream</span></span>
            <button onclick="logout()" style="width:auto; padding:6px 12px; background:#ef4444; color:#fff; margin:0; font-size:12px;">Disconnect</button>
        </div>
        <div id="chat-box"></div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="message-input" placeholder="Type an encrypted message..." style="margin:0; flex-grow: 1;">
            <button onclick="sendMessage()" style="width:80px; margin:0;">Send</button>
        </div>
    </div>
</div>

<script>
    // Config Core
    const SUPABASE_URL = "https://jrbxdmgpvnkjlwwihvdl.supabase.co";
    // ⚠️ PASTE YOUR LONG sb_publishable KEY INSIDE THE QUOTES BELOW
    const SUPABASE_KEY = "sb_publishable_GRYhrmnBUqbUs_4rNbgSew_M8lM-zQV";

    let sessionToken = null;
    let userEmail = null;
    let userId = null;

    // Zero-Dependency Light Engine
    const apiCall = async (path, method, body = null, customHeaders = {}) => {
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': sessionToken ? `Bearer ${sessionToken}` : `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            ...customHeaders
        };
        const config = { method, headers };
        if (body) config.body = JSON.stringify(body);
        const res = await fetch(`${SUPABASE_URL}${path}`, config);
        return res.status === 204 ? null : res.json();
    };

    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) return alert("Fields cannot be empty.");

        try {
            if (type === 'signup') {
                const data = await apiCall('/auth/v1/signup', 'POST', { email, password });
                if (data.error || data.msg) throw new Error(data.message || data.msg || data.error_description);
                alert("Verification link sent! Go check your real email inbox now.");
            } else {
                const data = await apiCall('/auth/v1/token?grant_type=password', 'POST', { email, password });
                if (data.error || data.error_description) throw new Error(data.error_description || data.error);
                
                sessionToken = data.access_token;
                userEmail = data.user.email;
                userId = data.user.id;
                
                setupChat();
            }
        } catch (err) {
            alert("System Alert: " + err.message);
        }
    }

    function setupChat() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('chat-section').classList.remove('hidden');
        loadMessages();
        setInterval(loadMessages, 3000); // High-speed fallback polling stream
    }

    async function loadMessages() {
        try {
            const data = await apiCall('/rest/v1/messages?select=*&order=created_at.asc', 'GET');
            if (data.error) return;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<div class="msg-meta">${msg.user_email}</div><div>${escapeHtml(msg.text)}</div>`;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (e) {}
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        if (!input.value.trim()) return;

        try {
            await apiCall('/rest/v1/messages', 'POST', 
                { user_id: userId, user_email: userEmail, text: input.value },
                { 'Prefer': 'return=minimal' }
            );
            input.value = '';
            loadMessages();
        } catch (e) {
            alert("Failed to sync text.");
        }
    }

    function logout() { location.reload(); }
    function escapeHtml(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
</script>
</body>
</html>
